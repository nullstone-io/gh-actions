name: publish-module
author: nullstone-io
description: Publish a Nullstone infrastructure module if its source files changed in the most recent commit
branding:
  icon: upload-cloud
  color: blue
inputs:
  dir:
    required: true
    description: Path (relative to repo root) where the module's source files live
  version:
    required: false
    default: next-patch
    description: |
      Semver version for the module. Special values:
      'next-patch' bumps the patch component of the latest module version;
      'next-build' appends +<build> using the short Git commit SHA to the latest version.
  if:
    required: false
    default: ''
    description: |
      Only publish when the condition is met. Supported:
      'checksum-changed' skips publishing when the packaged tarball matches the latest published version.
outputs:
  changed:
    description: '"true" if the module changed in the most recent commit, "false" otherwise'
    value: ${{ steps.changes.outputs.changed }}
  version:
    description: The module version emitted by `nullstone modules publish` on success (empty when the publish step is skipped)
    value: ${{ steps.publish.outputs.version }}
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
    - name: Detect module changes
      id: changes
      shell: bash
      env:
        MODULE_DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        if [ -n "$(git diff --name-only HEAD~1 HEAD -- "$MODULE_DIR")" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Nullstone
      if: steps.changes.outputs.changed == 'true'
      uses: nullstone-io/setup-nullstone-action@v0
    - name: Publish ${{ inputs.dir }}
      id: publish
      if: steps.changes.outputs.changed == 'true'
      working-directory: ${{ inputs.dir }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        IF_CONDITION: ${{ inputs.if }}
      run: |
        set -euo pipefail
        flags=(--version="$VERSION")
        [ -n "$IF_CONDITION" ] && flags+=(--if "$IF_CONDITION")
        version="$(nullstone modules publish "${flags[@]}")"
        printf '%s\n' "$version"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
