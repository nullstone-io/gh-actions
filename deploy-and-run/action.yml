name: deploy-and-run
author: nullstone-io
description: Deploy a Nullstone app and execute a command on it via `nullstone run`
branding:
  icon: play
  color: blue
inputs:
  stack:
    required: false
    description: Nullstone stack name (falls back to NULLSTONE_STACK env var)
  app:
    required: false
    description: Nullstone app to deploy (falls back to NULLSTONE_APP env var)
  env:
    required: false
    description: Target Nullstone environment (falls back to NULLSTONE_ENV env var)
  version:
    required: false
    default: ''
    description: Version of the app artifact to deploy, passed as --version to the `nullstone deploy` step (defaults to the most recently pushed version)
  command:
    required: true
    description: Command passed to `nullstone run` after deployment
  container:
    required: false
    default: ''
    description: Select a specific container within a task or pod (passed as --container)
  env-vars:
    required: false
    default: ''
    description: Newline-separated KEY=VALUE pairs, each passed as --env-var to the `nullstone deploy` step
  run-env-vars:
    required: false
    default: ''
    description: Newline-separated KEY=VALUE pairs, each passed as --env-var to the `nullstone run` step
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - uses: nullstone-io/setup-nullstone-action@v0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Deploy
      shell: bash
      env:
        NULLSTONE_STACK: ${{ inputs.stack || env.NULLSTONE_STACK }}
        NULLSTONE_APP: ${{ inputs.app || env.NULLSTONE_APP }}
        NULLSTONE_ENV: ${{ inputs.env || env.NULLSTONE_ENV }}
        VERSION: ${{ inputs.version }}
        ENV_VARS: ${{ inputs.env-vars }}
      run: |
        flags=(--wait)
        [ -n "$VERSION" ] && flags+=(--version "$VERSION")
        if [ -n "$ENV_VARS" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] && flags+=(--env-var="$line")
          done <<< "$ENV_VARS"
        fi
        nullstone deploy "${flags[@]}"
    - name: Run command
      shell: bash
      env:
        NULLSTONE_STACK: ${{ inputs.stack || env.NULLSTONE_STACK }}
        NULLSTONE_APP: ${{ inputs.app || env.NULLSTONE_APP }}
        NULLSTONE_ENV: ${{ inputs.env || env.NULLSTONE_ENV }}
        CONTAINER: ${{ inputs.container }}
        ENV_VARS: ${{ inputs.run-env-vars }}
      run: |
        flags=()
        [ -n "$CONTAINER" ] && flags+=(--container "$CONTAINER")
        if [ -n "$ENV_VARS" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] && flags+=(--env-var "$line")
          done <<< "$ENV_VARS"
        fi
        nullstone run "${flags[@]}" -- ${{ inputs.command }}
