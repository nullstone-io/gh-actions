name: build-publish-docker-app
author: nullstone-io
description: Build and publish a single Nullstone app container image
branding:
  icon: package
  color: blue
inputs:
  stack:
    required: false
    description: Nullstone stack name (falls back to NULLSTONE_STACK env var)
  app:
    required: false
    description: Nullstone app name, also used as the image tag (falls back to NULLSTONE_APP env var)
  env:
    required: false
    description: Nullstone environment name (falls back to NULLSTONE_ENV env var)
  dockerfile:
    required: false
    default: 'Dockerfile'
    description: Path to the Dockerfile
  context:
    required: false
    default: '.'
    description: Docker build context
  build-args:
    required: false
    default: ''
    description: Newline-separated KEY=VALUE pairs passed as --build-arg
  version:
    required: false
    default: ''
    description: Label for the deployment (defaults to the commit SHA of the current repo)
  unique:
    required: false
    default: 'false'
    description: Always push the artifact with a unique version; appends an incrementing -<count> suffix if the version already exists
outputs:
  version:
    description: The artifact version emitted by `nullstone push` on success
    value: ${{ steps.push.outputs.version }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
    - uses: docker/setup-buildx-action@v3
    - uses: nullstone-io/setup-nullstone-action@v0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: false
        load: true
        tags: ${{ inputs.app || env.NULLSTONE_APP }}
        provenance: false
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Publish to Nullstone
      id: push
      shell: bash
      env:
        NULLSTONE_STACK: ${{ inputs.stack || env.NULLSTONE_STACK }}
        NULLSTONE_APP: ${{ inputs.app || env.NULLSTONE_APP }}
        NULLSTONE_ENV: ${{ inputs.env || env.NULLSTONE_ENV }}
        VERSION: ${{ inputs.version }}
        UNIQUE: ${{ inputs.unique }}
      run: |
        set -euo pipefail
        flags=(--source="$NULLSTONE_APP")
        [ -n "$VERSION" ] && flags+=(--version "$VERSION")
        [ "$UNIQUE" = "true" ] && flags+=(--unique)
        output="$(nullstone push "${flags[@]}")"
        printf '%s\n' "$output"
        version="$(printf '%s' "$output" | tail -n1)"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
