name: deploy-app
author: nullstone-io
description: Deploy a Nullstone app via `nullstone deploy`
branding:
  icon: send
  color: blue
inputs:
  stack:
    required: false
    description: Nullstone stack name (falls back to NULLSTONE_STACK env var)
  app:
    required: false
    description: Nullstone app name (falls back to NULLSTONE_APP env var)
  env:
    required: false
    description: Target Nullstone environment (falls back to NULLSTONE_ENV env var)
  wait:
    required: false
    default: 'false'
    description: When 'true', pass --wait to `nullstone deploy` so the step blocks until the deployment completes
runs:
  using: composite
  steps:
    - uses: nullstone-io/setup-nullstone-action@v0
    - name: Deploy
      shell: bash
      env:
        NULLSTONE_STACK: ${{ inputs.stack || env.NULLSTONE_STACK }}
        NULLSTONE_APP: ${{ inputs.app || env.NULLSTONE_APP }}
        NULLSTONE_ENV: ${{ inputs.env || env.NULLSTONE_ENV }}
        WAIT: ${{ inputs.wait }}
      run: |
        flags=()
        [ "$WAIT" = "true" ] && flags+=(--wait)
        nullstone deploy "${flags[@]}"
